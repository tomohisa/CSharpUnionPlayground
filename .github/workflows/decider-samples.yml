name: Decider language samples

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/decider/**'
      - 'scripts/run_payment_java.py'
      - 'samples/file-based/package*.json'
      - 'global.json'
      - '.github/workflows/decider-samples.yml'
  push:
    branches: [main]
    paths:
      - 'samples/decider/**'
      - 'scripts/run_payment_java.py'
      - 'samples/file-based/package*.json'
      - 'global.json'
      - '.github/workflows/decider-samples.yml'

permissions:
  contents: read

jobs:
  decider:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check README code statistics
        run: python3 samples/decider/code_stats.py --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: TypeScript type checking
        run: |
          npm ci --prefix samples/file-based --ignore-scripts --no-audit --no-fund
          samples/file-based/node_modules/.bin/tsc -p samples/decider/typescript/tsconfig.json
      - name: Shared scenarios and cross-language event logs
        run: python3 samples/decider/run.py --verify
      - name: C# Native AOT
        run: python3 samples/decider/run.py --language csharp --native-aot --verify
