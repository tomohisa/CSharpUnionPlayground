name: Intel benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        type: choice
        options: [projection, all, json, wasi, decoder]
        default: projection
      json_roots:
        description: JSON roots (fixed count for the 14 GB runner)
        type: number
        default: 200000
      wasi_json_roots:
        description: Matched optimized AOT native/WASI JSON roots
        type: number
        default: 200000
      publish:
        description: Update tracked Intel results on main after a successful run
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: intel-benchmarks-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      BENCHMARK_SUITE: ${{ inputs.suite }}
      JSON_ROOTS: ${{ inputs.json_roots }}
      WASI_JSON_ROOTS: ${{ inputs.wasi_json_roots }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - name: Set Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install official WASI toolchains
        if: inputs.suite == 'wasi' || inputs.suite == 'decoder'
        env:
          WASI_TOOLS: ${{ runner.temp }}/wasi-tools
        run: |
          mkdir -p "$WASI_TOOLS"
          curl --fail --location --retry 3 https://dot.net/v1/dotnet-install.sh -o "$WASI_TOOLS/dotnet-install.sh"
          sdk_version=$(python3 -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])')
          bash "$WASI_TOOLS/dotnet-install.sh" --version "$sdk_version" --install-dir "$WASI_TOOLS/dotnet"
          "$WASI_TOOLS/dotnet/dotnet" workload install wasi-experimental --skip-manifest-update
          rustup target add wasm32-wasip1 --toolchain stable
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-macos.tar.gz -o "$WASI_TOOLS/wasi-sdk.tar.gz"
          echo "18f3f201ba9734e6a4455b0b6410690395a55e9ffa9f6f5066f66083a94b93b3  $WASI_TOOLS/wasi-sdk.tar.gz" | shasum -a 256 -c -
          tar -xzf "$WASI_TOOLS/wasi-sdk.tar.gz" -C "$WASI_TOOLS"
          curl --fail --location --retry 3 https://github.com/bytecodealliance/wasmtime/releases/download/v41.0.1/wasmtime-v41.0.1-x86_64-macos.tar.xz -o "$WASI_TOOLS/wasmtime.tar.xz"
          echo "19dfb6b23295fad88091f0a4fe9c651b99366f3973e3676f8cc9572589550b32  $WASI_TOOLS/wasmtime.tar.xz" | shasum -a 256 -c -
          tar -xJf "$WASI_TOOLS/wasmtime.tar.xz" -C "$WASI_TOOLS"
          echo "$WASI_TOOLS/wasmtime-v41.0.1-x86_64-macos" >> "$GITHUB_PATH"
          echo "WASI_DOTNET=$WASI_TOOLS/dotnet/dotnet" >> "$GITHUB_ENV"
          echo "WASI_SDK_PATH=$WASI_TOOLS/wasi-sdk-33.0-x86_64-macos" >> "$GITHUB_ENV"
      - name: Capture Intel host and run benchmarks sequentially
        run: |
          benchmark_roots="$JSON_ROOTS"
          if [ "$BENCHMARK_SUITE" = wasi ]; then benchmark_roots="$WASI_JSON_ROOTS"; fi
          python3 benchmarks/actions/run_intel.py --suite "$BENCHMARK_SUITE" --json-roots "$benchmark_roots"
      - name: Publish job summary
        if: always()
        run: |
          for report in benchmarks/observed/macos-intel-actions/*.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-benchmark-results
          path: |
            benchmarks/observed/macos-intel-actions/*.json
            benchmarks/observed/macos-intel-actions/*.md
            benchmarks/observed/macos-intel-actions/code/**
            benchmarks/observed/macos-intel-actions/decoder/**
          if-no-files-found: warn
          retention-days: 90

  update-data:
    concurrency:
      group: intel-benchmark-publication
      cancel-in-progress: false
    needs: benchmark
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: intel-benchmark-results
          path: ${{ runner.temp }}/intel-benchmark-results/
      - name: Merge the completed suite and retain other results
        run: python3 benchmarks/actions/publish_intel.py "$RUNNER_TEMP/intel-benchmark-results" benchmarks/observed/macos-intel-actions
      - name: Commit measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/observed/macos-intel-actions
          if ! git diff --cached --quiet; then
            git commit -m 'Update Intel benchmark observations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
