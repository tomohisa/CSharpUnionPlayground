[package]
name = "dcb-school-http"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
rusqlite = { version = "=0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
percent-encoding = "2"
